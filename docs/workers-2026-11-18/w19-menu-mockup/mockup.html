<header class="prototypeHeader"><div class="prototypeTitle">메뉴 구성 비교</div><nav class="planTabs" role="tablist" aria-label="메뉴 시안"><button role="tab" id="tab-current" data-plan="current" aria-selected="true" aria-controls="preview">현재</button><button role="tab" id="tab-plan1" data-plan="plan1" aria-selected="false" aria-controls="preview">안 1 · 우선 권고</button><button role="tab" id="tab-plan2" data-plan="plan2" aria-selected="false" aria-controls="preview">안 2 · 수평 확장 대비</button></nav><span class="meta">PC 1365 × 768 · 메뉴 구조 목업</span></header>
<div class="viewerTools"><nav class="sceneTabs" aria-label="미리 볼 화면"><button data-screen="start" aria-pressed="true">시작 화면</button><button data-screen="region" aria-pressed="false">지역 분석 헤더</button><button data-screen="market" aria-pressed="false">상권 헤더</button></nav><span class="meta" id="viewerHint">I 번호에 마우스를 올리거나 초점을 두면 w16 지적을 볼 수 있습니다.</span></div>
<main><section class="frame" id="preview" role="tabpanel" aria-labelledby="tab-current" aria-label="1365×768 PC 화면 목업"></section><section class="description" id="description" aria-label="시안 설명"></section></main>
<footer class="footer">메뉴의 위치와 이동을 비교하는 목업입니다. 지도·통계 계산은 연결하지 않았습니다. ‘안 1·안 2’는 제안이며 실제 서비스에 반영되지 않았습니다.</footer>
<script>
const $=s=>document.querySelector(s);
const state={plan:'current',screen:'start',mode:'analysis',data:'population',detail:'',menu:'',future:false,marketData:'sales',visited:false};
const datasets=[['population','생활인구','그 시간에 머무는 추계 인구','2026.01.01–11.12','시간별 · 행정동 · 성별·연령'],['mobility','생활이동','지역 사이를 오가는 이동 건수','2026.10.31','도착·출발 시각별 · 자치구 이동'],['migration','거주지 전입·전출','거주지를 옮기는 장기 변화','구 2001–2025 / 동 2015–2025','연간 · 자치구·행정동'],['commerce','행정동 추정매출','제공 업종의 추정매출','2025년 1분기–2026년 2분기','분기 · 행정동 · 시간 구간']];
const issueText={I02:'시작은 지역 자료와 모드가 중심입니다. 상권은 별도 버튼이라 두 서비스의 위계를 추론해야 합니다.',I03:'지역 탭과 상권 자료에 같은 ‘추정매출’을 씁니다. 행정동과 상권은 공간·업종 범위가 다른 자료입니다.',I04:'상권에는 모드 버튼이 없지만 지역 모드가 글자에 남습니다. 지역 시연용에서 들어오면 14px에서 18px로 바뀝니다.',I08:'주기간은 2026.11.12까지인데 작은 설명은 2026.01–10에 머물러 있습니다.',I09:'더보기 설명은 ‘상권 분석·출처·시작 화면·인쇄’지만 실제 항목은 시작·인쇄와 시연의 근거 정보입니다.',I11:'시연용에서 같은 단계인 두 지도 버튼의 폭이 112px와 125.09px로 다릅니다. 분석용은 같습니다.'};
function issue(id,classes=''){return state.plan==='current'?`<span class="issue ${classes}"><button data-issue="${id}" aria-label="${id} 문제 설명" aria-describedby="tip-${id}">${id}</button><span class="tooltip" role="tooltip" id="tip-${id}">${issueText[id]}</span></span>`:''}
const brand=()=>`<button class="brand" data-screen="start" aria-label="시작 화면으로"><span class="brandIcon" aria-hidden="true">▦</span><span>상권·인구</span></button>`;
function modes(){return `<div class="modeToggle" aria-label="지역 분석 모드"><button data-mode="analysis" aria-pressed="${state.mode==='analysis'}">분석용</button><button data-mode="presentation" aria-pressed="${state.mode==='presentation'}">시연용</button></div>`}
function topicHeader(){return `<div class="topicHeader flex">${brand()}<nav class="topicTabs" aria-label="주제 선택"><button data-topic="region" aria-pressed="${state.screen!=='market'}">지역 분석</button><button data-topic="market" aria-pressed="${state.screen==='market'}">상권 분석</button><button disabled aria-label="교통 예정 · 자료 확보 후">교통(예정) <small>자료 확보 후</small></button><button disabled aria-label="부동산 예정 · 자료 확보 후">부동산(예정) <small>자료 확보 후</small></button></nav></div>`}
function startHeader(){if(state.plan==='plan2')return topicHeader();return `<header class="appHeader startHeader">${state.plan==='current'?`<button class="brand" data-screen="start"><span class="brandIcon">▦</span><span>상권·인구 분석<br>광고 입지 전략</span></button><span class="annotated"><button data-screen="market">상권 지도</button>${issue('I02','end')}</span><nav>광고주 브리핑　/　지역 분석</nav><span class="grow"></span>${modes()}`:`${brand()}<span class="serviceName">서울 구·동 지역 분석 / 상권 분석</span><span class="grow"></span><span class="tag">서비스 선택</span>`}</header>`}
function currentStart(){return `${startHeader()}<div class="startContent"><div class="startHeading"><div><small>현재 제공 범위: 서울</small><h1>${state.mode==='presentation'?'광고 입지·집행 시점 분석':'지역별 광고 입지 분석'}</h1><p>분석 자료와 조건을 선택해 지역별 규모와 시간 변화를 비교합니다.</p></div>${state.visited?'<button data-screen="region">이전 '+(state.mode==='analysis'?'분석':'시연')+' 이어보기 →</button>':''}</div><h2>${state.mode==='analysis'?'분석 자료 선택':'브리핑 자료 선택'}</h2><p class="muted" style="margin-top:8px">판단에 필요한 자료를 먼저 고르세요. 자료마다 제공 기간과 단위가 다릅니다.</p><div class="datasetCards">${datasets.map(d=>`<div class="datasetItem"><button class="datasetCard" data-open-data="${d[0]}"><h3>${d[1]}<span>↗</span></h3><p>${d[2]}</p><strong>${d[3]}</strong><span class="meta">${d[4]}</span>${d[0]==='population'?'<span class="meta">일자별 조회·요일·월 구간 비교: 2026.01–10</span>':''}<span class="open">데이터 열기 →</span></button>${d[0]==='population'?issue('I08',''):''}</div>`).join('')}</div><aside class="sourceNote"><strong>자료와 보기의 구분</strong><p>자료는 비교할 지표, 보기는 확인할 방식입니다. 선택한 자료를 지도·상세 분석·후보 비교로 살펴보며, 정해진 순서를 따를 필요는 없습니다.</p><p>생활인구는 머무는 인구, 생활이동은 이동 건수, 전입·전출은 거주지 이동입니다. 서로 다른 기간의 인구와 매출을 구매전환율로 계산하지 않습니다.</p></aside></div>`}
function plan1Start(){return `${startHeader()}<div class="startContent"><div class="startHeading"><div><small>현재 제공 범위: 서울</small><h1>무엇을 살펴볼까요?</h1><p>구·동의 지역 특성과 상권의 수요를 구분해서 살펴봅니다.</p></div><button data-screen="region">이전 분석 이어보기 →</button></div><div class="serviceCards" data-peer="services"><article class="serviceCard"><div class="flex spread"><span class="tag">구·동 단위</span><span class="meta">분석용 · 시연용</span></div><h2>서울 구·동 지역 분석</h2><p>머무는 인구, 지역 간 이동, 거주지 변화와 행정동 매출을 비교합니다.</p><div class="quickLinks">${datasets.map(d=>`<button data-open-data="${d[0]}">${d[0]==='migration'?'거주지 이동':d[0]==='commerce'?'행정동 매출':d[1]}</button>`).join('')}</div><div class="cardTools"><button class="primary" data-launch-mode="analysis">분석용으로 열기 →</button><button data-launch-mode="presentation">시연용으로 열기 →</button></div></article><article class="serviceCard"><div class="flex spread"><span class="tag">상권 단위</span><span class="meta">단일 지도 작업공간</span></div><h2>상권 분석</h2><p>상권 매출과 유동인구를 분기·업종·지원 항목으로 살펴봅니다.</p><div class="quickLinks"><button data-market-data="sales">상권 매출</button><button data-market-data="population">상권 유동인구</button></div><div class="cardTools"><button class="primary" data-screen="market">상권 지도 열기 →</button><button data-screen="market">이전 상권 이어보기 →</button></div></article></div><div class="sourceNote"><strong>생활인구 제공 기간</strong><p>2026.01.01–11.12 · 자료 바로가기는 그대로 두고, 분석용·시연용은 지역 분석 안에서 선택합니다.</p></div><p class="meta" style="margin-top:14px">행정동 매출과 상권 매출은 공간·제공 업종 범위가 다릅니다. 서로 다른 자료를 합산하거나 전환율로 계산하지 않습니다.</p></div>`}
function plan2Start(){return `${topicHeader()}<div class="topicContent"><div class="topicIntro"><div><small>주제 → 자료 → 보기</small><h1>자료가 늘어도, 한 줄에 모두 놓지 않습니다.</h1><p class="muted">먼저 주제를 고르고 그 안에서 지원하는 자료만 선택합니다.</p></div><button data-future aria-expanded="${state.future}">교통 하위 구성 미리보기 ${state.future?'접기':'열기'}</button></div><div class="topicColumns"><article class="topicCard"><div class="flex spread"><h2>지역 분석</h2><span class="tag">현재 제공</span></div><label for="topic-dataset">자료 선택</label><select id="topic-dataset" data-start-dataset>${datasets.map(d=>`<option value="${d[0]}">${d[0]==='commerce'?'행정동 매출':d[0]==='migration'?'거주지 이동':d[1]}</option>`).join('')}</select><p>생활인구 기간: 2026.01.01–11.12</p><div class="cardTools"><button class="primary" data-launch-mode="analysis">분석용으로 열기 →</button><button data-launch-mode="presentation">시연용으로 열기 →</button></div></article><article class="topicCard future"><div class="flex spread"><h2>${state.future?'교통 하위 구성 · 회색 시안':'수평 확장의 자리'}</h2><span class="tag">자료 확보 후</span></div>${state.future?`<div class="futureNodes"><div><h3>지하철역</h3>역·노선 선택<br>승차·하차 / 기간별 추이</div><div><h3>버스 정류장·노선</h3>정류장·노선·방향 선택<br>점과 선 / 이동 추이</div></div><p>서비스 진입이 아닌 구조 미리보기입니다. 조회와 분석은 비활성입니다.</p>`:`<p>교통은 역·정류장·노선, 부동산은 단지·필지처럼 서로 다른 공간 단위를 갖습니다.</p><div class="futureNodes"><div><h3>교통(예정)</h3>자료 확보 후</div><div><h3>부동산(예정)</h3>자료 확보 후</div></div>`}</article></div><section class="registry" aria-label="주제별 자료 구성 예시"><div><strong>지역 분석</strong><p>생활인구 · 생활이동<br>거주지 이동 · 행정동 매출</p></div><div><strong>상권 분석</strong><p>상권 매출<br>상권 유동인구</p></div><div><strong>교통(예정)</strong><p>지하철역<br>버스 정류장·노선</p></div><div><strong>부동산(예정)</strong><p>단지·필지</p></div></section><div class="mapPlaceholder" style="min-height:115px;border:1px solid var(--line);border-radius:6px"><strong>지도 영역</strong><span>선택한 주제의 공간 단위에 맞춰 연결</span></div></div>`}
function dataTabs(){return `<nav class="dataTabs" aria-label="지역 분석 자료">${datasets.map(d=>`<span class="annotated"><button style="width:100%" class="${state.data===d[0]?'active':''}" data-data="${d[0]}" aria-pressed="${state.data===d[0]}">${d[0]==='migration'?'거주지 이동':d[0]==='commerce'?(state.plan==='current'?'추정매출':'행정동 매출'):d[1]}</button>${d[0]==='commerce'?issue('I03','float end'):''}</span>`).join('')}</nav>`}
const options={population:['요일·월중 특성','체류·거주 기반','연령·성별 비교','선택 지역 추이','두 시점 비교','두 시점 분포 지도','후보 지역 비교','조회 조건 비교'],mobility:['시간대별 이동 추이','두 시점 비교','이동 상대지역','지역별 상세 내역','후보 지역 비교','조회 조건 비교'],migration:['선택 지역 기간별 추이','두 시점 비교','연령·성별 구성','지역별 상세 내역','후보 지역 비교','조회 조건 비교'],commerce:['선택 지역 기간별 추이','두 시점 비교','지역별 상세 내역','후보 지역 비교','조회 조건 비교']};
function detailSelect(market=false){let list=market?['선택 상권 추이','두 분기 비교','후보 상권 비교']:options[state.data];return `<select data-detail aria-label="${market?'상권':''}상세 분석"><option value="">상세 분석</option>${list.map(x=>`<option ${state.detail===x?'selected':''}>${x}</option>`).join('')}</select>`}
function menu(name,symbol,label){return `<span class="menuWrap"><button class="${symbol?'icon':''}" data-menu="${name}" aria-label="${label}" title="${name==='more'&&state.plan==='current'?'상권 분석·출처·시작 화면·인쇄':label}" aria-expanded="${state.menu===name}">${symbol||label}</button>${name==='more'?issue('I09','float end'):''}${state.menu===name?`<div class="popover" role="group" aria-label="${label}">${name==='more'?`${state.mode==='presentation'?'<button data-demo="근거 정보 보기">근거 정보 보기</button>':''}<button data-screen="start">시작 화면</button><button data-demo="브리핑 인쇄">브리핑 인쇄</button>`:name==='layout'?'<button data-demo="균형형">균형형</button><button data-demo="지도 중심">지도 중심</button><button data-demo="비교 중심">비교 중심</button>':name==='query'?'<button data-demo="상단 조회 바">상단 조회 바</button><button data-demo="우측 고정">우측 고정</button><button data-demo="띄우기">띄우기</button>':name==='advanced'?'<p>업종 / 비교 항목 · 한 가지씩 / 세부 항목</p><button data-demo="추가 조회 옵션">조건 선택 위치 확인</button>':'<p>표시·배치 메뉴 위치를 확인하는 목업입니다.</p><button data-demo="메뉴 확인">확인</button>'}<button data-close-menu>닫기</button></div>`:''}</span>`}
function regionHeader(){return `${state.plan==='plan2'?topicHeader():''}<header class="appHeader ${state.plan==='current'?'':'serviceHeader'}">${state.plan==='plan2'?'<span class="serviceName">지역 분석</span>':brand()}${state.plan==='plan1'?'<span class="serviceName">서울 구·동 지역 분석</span>':''}${dataTabs()}<span class="viewTools flex"><button data-map>지도</button>${!state.detail?detailSelect():''}</span><button data-screen="market">${state.plan==='current'?'상권 지도':'상권 분석으로'}</button>${menu('layout','◫','화면 배치')}${modes()}${menu('more','···',state.plan==='current'?'추가 메뉴':'시작 화면·브리핑 인쇄'+(state.mode==='presentation'?'·근거 정보':''))}${menu('query','▣','조회창 배치')}</header>`}
function regionQuery(){let d=state.data;return `<div class="query" aria-label="조회 조건 위치">${d==='population'?`<div class="field"><label>기준일</label><input aria-label="기준일" type="date" value="2026-11-12"></div><div class="field"><span>조회 시각</span><select aria-label="조회 시각"><option>18:00</option><option>12:00</option></select></div><button class="icon" data-demo="시간 빠르게 이동" aria-label="시간 빠르게 이동">◷</button>`:d==='mobility'?'<div class="field">일자　2026.10.31</div>':'<div class="field">'+(d==='commerce'?'기준분기　2026년 2분기':'연도　2025년')+'</div>'}<div class="field"><span>자치구</span><select aria-label="자치구"><option>서울 전체 · 25개 구</option><option>종로구</option></select></div>${d==='population'?'<div class="field"><span>연령</span><select aria-label="연령"><option>전체 연령</option><option>20–39세</option></select></div><div class="field"><span>성별</span><select aria-label="성별"><option>전체 성별</option><option>남성</option><option>여성</option></select></div>':d==='commerce'?'<div class="field">매출 시간대　하루 전체</div>':d==='mobility'?'<div class="field">방향　유입</div><div class="field">시각 기준　도착</div><div class="field">집계　선택 시간</div>':'<div class="field">전입·전출　전입</div><div class="field">인구 세분　전체</div>'}</div>`}
function placeholder(){return `<div class="mapPlaceholder"><div class="mapLines" aria-hidden="true"></div><strong>지도 영역</strong><span>통계값과 실제 지도는 생략했습니다.</span></div>`}
function region(){return `${regionHeader()}<div class="workArea">${regionQuery()}<div class="mapSplit"><section class="mapPanel"><div class="panelHeading"><h2>${state.detail||'지역별 '+datasets.find(d=>d[0]===state.data)[1]+' 비교'}</h2><span class="flex">${state.detail?detailSelect():''}<button data-demo="표 내려받기">표 내려받기</button><button data-demo="전체화면">⛶ 전체화면</button></span></div>${state.detail?`<div class="detailBody"><h2>${state.detail}</h2><p>선택한 상세 화면의 자리입니다.</p><button data-map>← 지도로 돌아가기</button></div>`:`<div class="mapToolbar"><div class="levelButtons"><button class="primary" data-demo="서울 구 지도">서울 구 지도</button><button disabled>선택 구 동 지도</button></div>${issue('I11')}<span class="grow"></span><button data-demo="지도 확대">＋</button><button data-demo="원래 범위">원래 범위</button>${menu('display','☷','색상·표시 설정')}</div>${placeholder()}`}</section><aside class="infoPanel"><h2>지역 비교</h2><p class="muted">선택한 지역의 지표와 순위가 표시되는 자리입니다.</p><div class="emptyItem">선택 지역 정보</div><div class="emptyItem">같은 조건의 지역 순위</div><span class="grow"></span><button data-demo="후보 지역 비교">후보 지역 비교</button></aside></div><p class="workspaceFoot">${state.plan==='current'?'현재 메뉴 배치':'단일 조회 바 · 지도 / 상세 · 같은 조건으로 복귀'} · 통계 계산은 연결하지 않았습니다.</p></div>`}
function market(){let current=state.plan==='current';return `${state.plan==='plan2'?topicHeader():''}<header class="appHeader">${brand()}<strong class="${current?'marketTitle':'serviceName'}">${current?'상권 지도 · 유동인구와 매출':'상권 분석'}</strong><span class="grow"></span><button data-demo="지역 정보">지역 정보 닫기</button>${menu('market-layout','◫','상권 창 배치')}<button class="primary" data-screen="region">${current?'지역 분석 지도':'지역 분석으로'}</button></header><div class="workArea"><div class="query marketQuery"><div class="field"><label for="market-dataset">자료</label><select id="market-dataset" data-market-select><option value="sales" ${state.marketData==='sales'?'selected':''}>${current?'추정매출':'상권 매출'}</option><option value="population" ${state.marketData==='population'?'selected':''}>${current?'유동인구':'상권 유동인구'}</option></select>${issue('I03')}</div><div class="field">분기 <select aria-label="기준 분기"><option>2026년 2분기</option><option>2025년 2분기</option></select></div><div class="field">자치구 <select aria-label="상권 자치구"><option>전체</option><option>종로구</option></select></div><div class="field search"><label for="market-search">상권 검색</label><input id="market-search" placeholder="예: 홍대, 공덕"></div><div class="field">상권 유형 <select aria-label="상권 유형"><option>전체</option><option>골목상권</option></select></div>${menu('advanced','⇆','추가 조회 옵션')}</div><div class="mapSplit"><section class="mapPanel"><div class="marketTop"><strong class="grow">서울 전체</strong>${detailSelect(true)}${menu('market-display','⇆','지도 표시')}<button class="icon" data-demo="출처·경계·해석 기준" aria-label="출처·경계·해석 기준">ⓘ</button><button data-demo="표 내려받기">표 내려받기</button></div>${state.detail?`<div class="detailBody"><h2>${state.detail}</h2><p>상권별 분기·후보 비교의 자리입니다.</p><button data-map>← 지도로 돌아가기</button></div>`:placeholder()}</section><aside class="infoPanel"><h2>지역 정보</h2><p>상권을 선택하면 해당 상권의 정보와 후보 담기를 보여줍니다.</p><div class="emptyItem">현재 조건의 상권 순위</div><span class="grow"></span><button data-demo="후보 상권 비교">후보 상권 비교</button></aside></div>${current?`<div class="flex"><span class="meta">관측 경로 재현:</span><button data-mode="analysis" aria-pressed="${state.mode==='analysis'}">지역 분석용에서 진입</button><button data-mode="presentation" aria-pressed="${state.mode==='presentation'}">지역 시연용에서 진입</button>${issue('I04','above')}<span class="meta">이 행은 상권의 모드 메뉴가 아닌 목업 비교 도구입니다.</span></div>`:'<p class="workspaceFoot">모드 구분 없는 상권 작업공간 · 지역 분석의 모드와 독립</p>'}</div>`}
const descriptions={current:{good:['기존 자료 바로가기와 작업 경로가 익숙합니다.','지역 분석과 상권 지도에 필요한 도구가 이미 있습니다.'],bad:['서비스·모드·자료가 서로 다른 위치에 놓입니다.','두 매출의 공간 범위와 일부 메뉴 설명을 다시 확인해야 합니다.'],changes:['w16의 현재 메뉴 이름과 순서를 재현했습니다.','I02·I03·I04·I08·I09·I11에 설명을 붙였습니다.','시연용 구/동 버튼의 관측된 폭 차이도 남겼습니다.']},plan1:{good:['두 서비스를 같은 위계에서 고를 수 있습니다.','기존 자료 바로가기와 이어보기는 유지합니다.'],bad:['새 주제가 많이 늘 때의 탐색까지 해결하지는 않습니다.','길어진 서비스·자료 이름은 헤더 공간 검수가 필요합니다.'],changes:['두 서비스 진입을 나란히 배치했습니다.','행정동 매출과 상권 매출의 이름을 구분했습니다.','지역에만 모드를 두고, 더보기 설명과 기간을 맞췄습니다.']},plan2:{good:['주제를 고른 뒤 필요한 자료만 보여줍니다.','자료가 늘어도 긴 탭 행을 계속 늘리지 않습니다.'],bad:['지금 적용하면 선택 단계와 구현 비용이 늘어납니다.','새 자료의 기간·공간·집계 규칙부터 확보해야 합니다.'],changes:['상단에 주제 선택, 하단에 주제별 자료를 배치했습니다.','교통·부동산은 ‘자료 확보 후’ 비활성으로 남겼습니다.','교통의 점·선 구조는 별도 회색 미리보기로만 보여줍니다.']}};
function render(){let p=state.plan;document.querySelectorAll('[data-plan]').forEach(b=>{let on=b.dataset.plan===p;b.setAttribute('aria-selected',on);b.tabIndex=on?0:-1});document.querySelectorAll('.sceneTabs button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.screen===state.screen));$('#preview').setAttribute('aria-labelledby','tab-'+p);$('#viewerHint').textContent=p==='current'?'I 번호에 마우스를 올리거나 초점을 두면 w16 지적을 볼 수 있습니다.':'같은 화면을 오가며 서비스 이름·자료 선택·모드 범위를 비교하세요.';$('#preview').innerHTML=`<div class="screen ${p} ${state.mode==='presentation'&&(state.screen!=='market'||p==='current')?'presentation':''} ${state.screen==='market'?'market':''} ${p==='current'&&state.mode==='presentation'&&state.screen==='market'?'inherited':''}">${state.screen==='start'?(p==='current'?currentStart():p==='plan1'?plan1Start():plan2Start()):state.screen==='region'?region():market()}</div>`;let d=descriptions[p];$('#description').innerHTML=`<div><h2>장점</h2>${d.good.map(t=>`<p>${t}</p>`).join('')}</div><div><h2>단점</h2>${d.bad.map(t=>`<p>${t}</p>`).join('')}</div><div><h2>바뀌는 점</h2><ul>${d.changes.map(t=>`<li>${t}</li>`).join('')}</ul></div>`}
function toast(message){document.querySelector('.toast')?.remove();let e=document.createElement('div');e.className='toast';e.setAttribute('role','status');e.textContent=message+' · 위치와 이동만 확인하는 목업으로, 실제 실행은 연결하지 않았습니다.';$('#preview').append(e);setTimeout(()=>e.remove(),3500)}
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b||b.disabled)return;if(b.dataset.issue){let box=b.closest('.issue');box.dataset.open=box.dataset.open==='true'?'false':'true';return}if(b.dataset.plan){state.plan=b.dataset.plan;state.screen='start';state.mode='analysis';state.detail='';state.menu='';state.future=false;render();return}if(b.dataset.screen){state.screen=b.dataset.screen;state.detail='';state.menu='';if(state.screen!=='start')state.visited=true;render();return}if(b.dataset.mode){state.mode=b.dataset.mode;state.menu='';render();return}if(b.dataset.openData){state.data=b.dataset.openData;state.screen='region';state.visited=true;state.detail='';render();return}if(b.dataset.launchMode){state.mode=b.dataset.launchMode;state.screen='region';state.visited=true;state.detail='';render();return}if(b.dataset.marketData){state.marketData=b.dataset.marketData;state.screen='market';state.detail='';render();return}if(b.dataset.topic){state.screen=b.dataset.topic;state.detail='';state.menu='';render();return}if(b.hasAttribute('data-future')){state.future=!state.future;render();return}if(b.dataset.data){state.data=b.dataset.data;state.detail='';state.menu='';render();return}if(b.hasAttribute('data-map')){state.detail='';state.menu='';render();return}if(b.dataset.menu){state.menu=state.menu===b.dataset.menu?'':b.dataset.menu;render();return}if(b.hasAttribute('data-close-menu')){state.menu='';render();return}if(b.dataset.demo){state.menu='';render();toast(b.dataset.demo)}});
document.addEventListener('change',e=>{if(e.target.matches('[data-detail]')){state.detail=e.target.value;state.menu='';render()}if(e.target.matches('[data-market-select]')){state.marketData=e.target.value;render()}if(e.target.matches('[data-start-dataset]'))state.data=e.target.value});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){document.querySelectorAll('.issue[data-open]').forEach(x=>delete x.dataset.open);if(state.menu){state.menu='';render()}}if(e.target.matches('[data-plan]')&&['ArrowLeft','ArrowRight','Home','End'].includes(e.key)){e.preventDefault();const a=['current','plan1','plan2'];let i=a.indexOf(state.plan);i=e.key==='Home'?0:e.key==='End'?2:(i+(e.key==='ArrowRight'?1:2))%3;document.querySelector('[data-plan="'+a[i]+'"]').click();document.querySelector('[data-plan="'+a[i]+'"]').focus()}});
render();
</script></body></html>
