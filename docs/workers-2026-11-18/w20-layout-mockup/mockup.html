<div class="prototypeHint"><span>목업: 상단·좌측 메뉴를 눌러 보세요. 지도·통계는 연결하지 않았습니다.</span><span>안 2 발전형 · PC</span></div>
<main id="app" class="app" aria-label="광고 입지 분석 작업공간 목업"></main>
<section id="description" class="description" aria-label="현재 배치 설명"></section>
<script>
const $=selector=>document.querySelector(selector);
const catalogs={
 region:[
 {id:'population',label:'생활인구',short:'인구',period:'일·시간',unit:'명',views:[['patterns','요일·월중 특성','요일'],['resident','체류·거주 기반','거주'],['demographic','연령·성별 비교','대상'],['trend','선택 지역 시간 추이','추이'],['compare','두 시간 비교','시간'],['distribution','두 시간 분포 지도','분포'],['candidates','후보 지역 비교','후보'],['scenario','조회 조건 비교','조건']]},
 {id:'mobility',label:'생활이동',short:'이동',period:'일·시간',unit:'건',views:[['trend','시간대별 이동 추이','추이'],['compare','두 시간 비교','시간'],['connections','이동 상대지역','상대'],['table','지역별 상세 내역','내역'],['candidates','후보 지역 비교','후보'],['scenario','조회 조건 비교','조건']]},
 {id:'migration',label:'거주지 이동',short:'전입',period:'연도',unit:'명',views:[['trend','선택 지역 연도별 추이','추이'],['compare','두 연도 비교','연도'],['demographic','연령·성별 구성','대상'],['table','지역별 상세 내역','내역'],['candidates','후보 지역 비교','후보'],['scenario','조회 조건 비교','조건']]},
 {id:'commerce',label:'행정동 매출',short:'매출',period:'분기',unit:'원',views:[['trend','선택 지역 분기별 추이','추이'],['compare','두 분기 비교','분기'],['table','지역별 상세 내역','내역'],['candidates','후보 지역 비교','후보'],['scenario','조회 조건 비교','조건']]}
 ],
 market:[{id:'sales',label:'상권 매출',short:'매출',period:'분기',unit:'원',views:[['trend','선택 상권 추이','추이'],['compare','두 분기 비교','분기'],['candidates','후보 상권 비교','후보']]},{id:'population',label:'상권 유동인구',short:'유동',period:'분기',unit:'명',views:[['trend','선택 상권 추이','추이'],['compare','두 분기 비교','분기'],['candidates','후보 상권 비교','후보']]}]
};
const sessions={region:{data:'population',view:'map',mode:'analysis',left:true,right:true,candidates:[],queries:{}},market:{data:'sales',view:'map',left:true,right:true,candidates:[],queries:{}}};
const state={page:'home',last:null,popover:''};
const current=()=>sessions[state.page];
const dataset=()=>catalogs[state.page].find(d=>d.id===current().data);
const isPresentation=()=>state.page==='region'&&current().mode==='presentation';
const viewLabel=()=>current().view==='map'?'지도':dataset().views.find(v=>v[0]===current().view)?.[1]||'지도';
function query(){let s=current();return s.queries[s.data]??=(state.page==='market'?{period:'20262',region:'서울 전체',market:'선택 전',industry:'전체 업종',dimension:'전체'}:s.data==='population'?{date:'2026.11.12',hour:'18:00',region:'서울 전체',age:'전체',sex:'전체'}:s.data==='mobility'?{date:'2026.10.31',hour:'18:00',region:'서울 전체',direction:'유입',basis:'도착',aggregation:'선택 시간'}:s.data==='migration'?{period:'2025',region:'서울 전체',metric:'전입',group:'전체'}:{period:'20262',region:'서울 전체',time:'하루 전체'})}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function enter(service){state.page=service;state.last=service;state.popover='';render()}
function topbar(){let region=state.page==='region';return `<header class="topbar"><button class="brand" data-home aria-label="시작 화면으로"><span class="brandMark" aria-hidden="true">▦</span><span class="brandText">상권·인구<small>광고 입지 분석</small></span></button><nav class="topicNav" aria-label="메인 주제"><button data-topic="region" aria-pressed="${region}">지역 분석</button><button data-topic="market" aria-pressed="${state.page==='market'}">상권 분석</button><button disabled aria-label="교통 예정 · 자료 확보 후"><span>교통(예정)</span><small>자료 확보 후</small></button><button disabled aria-label="부동산 예정 · 자료 확보 후"><span>부동산(예정)</span><small>자료 확보 후</small></button></nav><span class="grow"></span><div class="row topTools">${region?`<div class="modeToggle" aria-label="지역 분석 모드"><button data-mode="analysis" aria-pressed="${current().mode==='analysis'}">분석용</button><button data-mode="presentation" aria-pressed="${current().mode==='presentation'}">시연용</button></div>`:''}<button class="moreButton" data-popover="more" aria-label="더보기: 인쇄·출처·도움말" title="인쇄·출처·도움말" aria-expanded="${state.popover==='more'}">···</button></div>${['more','source','help'].includes(state.popover)?popover(state.popover):''}</header>`}
function home(){return `<div class="home"><div class="homeHeading"><small>현재 제공 범위 · 서울</small><h1>어떤 입지를 살펴볼까요?</h1><p>지역의 특성과 상권의 수요를 나누어 살펴봅니다.</p></div><div class="homeCards"><button class="entryCard" data-topic="region"><h2>지역 분석</h2><p>서울 구·동의 인구와 이동, 거주 기반을<br>같은 조건으로 비교합니다.</p><span class="enter">지역 분석 열기 →</span></button><button class="entryCard" data-topic="market"><h2>상권 분석</h2><p>상권의 매출과 유동인구를 살펴보고<br>후보 상권을 비교합니다.</p><span class="enter">상권 지도 열기 →</span></button></div><div class="homeResume"><button data-resume ${state.last?'':'disabled'}>이어보기 →</button><p class="meta">${state.last?'이 브라우저에서 마지막으로 보던 분석 화면으로 돌아갑니다.':'서비스를 열면 이 브라우저에서 이어볼 수 있습니다.'}</p></div><div class="futureNote"><span>교통 · 예정</span><span>부동산 · 예정</span> 자료 확보 후 추가합니다.</div></div>`}
function leftMenu(){let s=current(),d=dataset();let views=[['map','지도','지도'],...d.views];return `<aside class="leftNav ${s.left?'':'leftCollapsed'}" aria-label="${state.page==='region'?'지역':'상권'} 자료와 분석 메뉴"><div class="sideHead"><strong>자료와 분석</strong><button data-toggle="left" aria-label="${s.left?'좌측 메뉴 접기':'좌측 메뉴 펼치기'}" aria-expanded="${s.left}" title="${s.left?'좌측 메뉴 접기':'좌측 메뉴 펼치기'}">${s.left?'‹':'›'}</button></div><div class="sideMenus"><section class="navGroup"><h2 class="groupHeading">자료</h2><nav class="navItems dataMenu" aria-label="자료 선택">${catalogs[state.page].map(item=>`<button data-data="${item.id}" aria-pressed="${s.data===item.id}" title="${item.label}" aria-label="${item.label}">${s.left?item.label:item.short}</button>`).join('')}</nav></section><section class="navGroup"><h2 class="groupHeading">보기${s.left?`<span>${d.period}</span>`:''}</h2><nav class="navItems viewMenu" aria-label="보기 선택">${views.map(v=>`<button data-view="${v[0]}" ${s.view===v[0]?'aria-current="page"':''} aria-label="${v[1]}" title="${v[1]}">${s.left?v[1]:v[2]}</button>`).join('')}</nav></section></div><p class="sideFooter">왼쪽은 자료·보기 선택<br>조회 조건은 중앙 상단</p></aside>`}
function field(name,key,values,cls=''){let q=query();return `<div class="queryField ${cls}"><label for="query-${key}">${name}</label><select id="query-${key}" data-query="${key}">${values.map(item=>{let v=Array.isArray(item)?item:[item,item];return `<option value="${escapeHtml(v[0])}" ${q[key]===v[0]?'selected':''}>${escapeHtml(v[1])}</option>`}).join('')}</select></div>`}
const regionOptions=['서울 전체','종로구','강남구','마포구'];
const quarters=[['20262','2026년 2분기'],['20261','2026년 1분기'],['20252','2025년 2분기']];
function querybar(){let d=dataset(),content;if(state.page==='market'){content=field('분기','period',quarters,'date')+field('지역','region',regionOptions,'region')+field('상권','market',['선택 전','노량진역(노량진)','가산디지털단지','가락시장'],'region')}else if(d.id==='population'){content=field('기준일','date',['2026.11.12','2026.11.01'],'date')+field('시각','hour',['18:00','12:00'],'time')+field('지역','region',regionOptions,'region')+field('연령','age',['전체','20–39세','40–59세','60세 이상'],'age')+field('성별','sex',['전체','남성','여성'],'sex')}else if(d.id==='mobility'){content=field('일자','date',['2026.10.31'],'date')+field('지역','region',regionOptions,'region')+field('방향','direction',['유입','유출','유입−유출'])+field('시각','hour',['18:00','12:00'],'time')}else if(d.id==='migration'){content=field('연도','period',['2025','2024','2023'],'date')+field('지역','region',regionOptions,'region')+field('지표','metric',['전입','전출','순이동'])+field('세분','group',['전체','성별','연령별'])}else{content=field('분기','period',quarters,'date')+field('지역','region',regionOptions,'region')+field('시간대','time',['하루 전체','11–14시','17–21시'],'region')};return `<form class="querybar" aria-label="현재 조회 조건" onsubmit="return false">${content}<span class="queryExtra"><button data-popover="conditions" type="button" aria-label="추가 조회 조건" title="추가 조회 조건" aria-expanded="${state.popover==='conditions'}">⇆</button>${state.popover==='conditions'?popover('conditions'):''}</span></form>`}
function center(){let s=current(),d=dataset(),label=viewLabel();return `<section class="center" aria-label="중앙 분석"><div class="centerHeading"><div><h1>${d.label} · ${label}</h1><p class="context">${state.page==='region'?'서울 구·동 지역 분석':'상권 분석'} · ${d.period} 자료</p></div><button class="auxToggle" data-toggle="right" aria-controls="right-info" aria-expanded="${s.right}" aria-label="${s.right?'우측 보조정보 접기':'우측 보조정보 펼치기'}">${s.right?'보조정보 접기 ›':'‹ 보조정보 보기'}</button></div>${querybar()}<section class="canvasPanel" aria-label="${label} 결과 영역"><div class="canvas"><div class="canvasTools"><button data-popover="display" aria-expanded="${state.popover==='display'}">표시 설정</button><button data-popover="legend" aria-expanded="${state.popover==='legend'}">범례</button></div><div class="canvasCenter"><span class="canvasType">${s.view==='map'?'공간 분포':label}</span><strong>${s.view==='map'?'지도 영역':'그래프 영역'}</strong><p>${s.view==='map'?'자료와 지역을 고르면 같은 공간에서 비교합니다.':'선택한 분석을 중앙에서 확인하고 지도로 돌아갑니다.'}</p><small class="meta">지도·통계값을 생략한 배치 목업입니다.</small></div>${s.view!=='map'?'<button class="canvasReturn" data-view="map">← 지도로 돌아가기</button>':''}${['display','legend'].includes(state.popover)?popover(state.popover):''}</div></section><p class="workspaceNote">조회 조건은 위에서 · 자료와 보기는 왼쪽에서 · 표시 설정은 지도 안에서</p></section>`}
function selectedName(){let q=query();return state.page==='market'?(q.market==='선택 전'?'상권 선택 전':q.market):q.region}
function rightInfo(){if(!current().right)return '';let d=dataset(),s=current(),presentation=isPresentation();return `<aside class="rightInfo" id="right-info" aria-label="선택 대상 보조정보"><div class="rightHead"><h2>선택 대상 보조정보</h2></div><div class="rightContent"><section><p class="meta">선택 대상</p><h3 class="selectedName">${escapeHtml(selectedName())}</h3><div class="metric"><span class="metricLabel">${d.label}</span><strong>— <small>${d.unit}</small></strong></div>${presentation?'':`<div class="metric secondary"><span class="metricLabel">${d.period==='분기'?'직전 분기 대비':d.period==='연도'?'직전 연도 대비':'직전 시간 대비'}</span><strong>— <small>${d.unit}</small></strong></div>`}</section><section><div class="candidateHeader"><h3>후보</h3><span>${s.candidates.length} / 3곳</span></div><div class="candidateRows">${[0,1,2].map(i=>`<div class="candidateRow"><span class="slot">${i+1}</span><span class="name">${s.candidates[i]?escapeHtml(s.candidates[i]):'선택 전'}</span><span class="dash">—</span>${s.candidates[i]?`<button data-remove="${i}" aria-label="${escapeHtml(s.candidates[i])} 후보 해제">×</button>`:''}</div>`).join('')}</div><button class="candidateAdd" data-add-candidate ${selectedName()==='서울 전체'||selectedName()==='상권 선택 전'||s.candidates.includes(selectedName())||s.candidates.length>=3?'disabled':''}>${s.candidates.includes(selectedName())?'후보에 담김':s.candidates.length>=3?'최대 3곳 선택됨':'선택 대상 후보 담기'}</button></section><section class="sourceSummary"><h3>${presentation?'해석·출처':'해석·출처 요약'}</h3><p>${state.page==='market'?'상권과 행정동은 다른 공간 단위입니다. 제공 항목은 한 가지씩 비교합니다.':'생활인구·생활이동·거주지 이동은 서로 다른 지표입니다. 기간과 단위를 함께 확인합니다.'}</p>${presentation?'':'<p>원본 기간·경계·결측은 자료 연결 후 표시합니다.</p>'}<button data-popover="source">출처·해석 보기</button></section></div></aside>`}
function popover(kind){let heading,body,cls=kind;if(kind==='more'){heading='더보기';body='<div class="menuList"><button data-print>브리핑 인쇄</button><button data-popover="source">출처·해석 기준</button><button data-popover="help">도움말</button></div>'}else if(kind==='source'){heading='출처·해석 기준';cls='reading';body='<p>기존 서비스의 공개 통계를 연결할 자리입니다. 이 목업에는 원자료와 통계값을 넣지 않았습니다.</p><p>자료별 기간·공간·집계 단위와 결측을 구분하며, 서로 다른 인구와 매출을 전환율로 계산하지 않습니다.</p>'}else if(kind==='help'){heading='작업공간 사용법';cls='reading';body='<p>상단에서 주제, 왼쪽에서 자료와 보기를 고릅니다. 중앙 위에서 조회 조건을 바꾸고 오른쪽에서 선택 대상을 확인합니다.</p><p>좌측은 화살표, 우측은 보조정보 버튼으로 접고 펼칩니다. 시연용은 좌측을 접고 핵심 근거를 크게 보여줍니다.</p>'}else if(kind==='display'){heading='표시 설정';body='<p>조회할 자료는 바꾸지 않고 지도 표현을 조절합니다.</p><label>색상<select data-display="palette"><option>기본 파랑</option><option>청록</option></select></label><label>색상 범위<select data-display="range"><option>자동 범위</option><option>직접 범위</option></select></label><small class="meta">표현 옵션의 위치를 확인하는 목업입니다.</small>'}else if(kind==='legend'){heading='범례';cls='display';body='<p>실제 관측값 범위가 들어갈 자리입니다.</p><div style="height:12px;background:#d2dbe5;border:1px solid #aabbd0;margin:12px 0" aria-hidden="true"></div><p>값 —　　단위 —</p><small class="meta">실제 값 없이 범례의 위치만 보여줍니다.</small>'}else{heading='추가 조회 조건';body=state.page==='market'?(current().data==='sales'?field('업종','industry',['전체 업종','한식음식점']):'')+field('항목','dimension',['전체','시간대','성별','연령대','요일'])+'<p>성별·연령·요일·시간은 한 가지씩 비교합니다.</p>':current().data==='mobility'?field('기준','basis',['도착','출발'])+field('집계','aggregation',['선택 시간','0시부터 누적','원본일자 전체']):'<p>기본 조회는 상단 한 벌입니다. 자료별 추가 조건이 이곳에 들어갑니다.</p>'};return `<section class="popover ${cls}" role="dialog" aria-label="${heading}"><div class="popoverHead"><h2>${heading}</h2><button data-close-popover aria-label="${heading} 닫기">×</button></div>${body}</section>`}
function explanation(){if(state.page==='home'){return `<div><h2>배치의 목적</h2><p>처음에는 두 서비스 중 할 일을 고릅니다.</p><p>자료 목록과 분석 결과는 진입 후에 보여줍니다.</p></div><div><h2>장점</h2><p>처음부터 모든 자료를 읽을 필요가 없습니다.</p><p>이어보기 하나로 이전 작업에 돌아갈 수 있습니다.</p></div><div><h2>현재 대비 변경·주의</h2><p>비교용 화면 버튼을 없애고 실제 메뉴만 남겼습니다.</p><p>이 목업의 이어보기는 현재 탭 안에서만 유지됩니다.</p><p>예정 서비스는 자료 확보 전에는 열 수 없습니다.</p></div>`}let s=current(),left=s.left?200:64,right=s.right?300:0,center=window.innerWidth-left-right,canvas=center-34;return `<div><h2>배치의 목적·변경</h2><p>${isPresentation()?'현장에서 조건과 후보를 바꾸며 결론을 만드는 시연 배치입니다.':'자료 탐색·조회·분석·보조정보의 자리를 나눕니다.'}</p><p>상단은 주제, 좌측은 자료·보기, 중앙은 분석, 우측은 선택 정보입니다.</p><p class="widthNote">현재 폭: 좌 ${left}px + 중앙 ${center}px + 우 ${right}px = ${window.innerWidth}px<br>중앙 안쪽 여백 32px·결과 경계 2px 제외 → 지도/그래프 ${canvas}px</p></div><div><h2>장점</h2><p>자료가 늘어도 상단에 탭을 계속 늘리지 않습니다.</p><p>좌·우를 접으면 중앙의 지도와 그래프가 넓어집니다.</p><p class="widthNote">기본 제안: 좌 200px · 우 300px<br>시연 기본: 좌 64px로 접힘 · 우 300px</p></div><div><h2>주의할 점</h2><p>양쪽을 열면 지도 가용 폭이 줄어듭니다.</p><p>1365px에서는 양쪽 열림 시 지도 831px가 남습니다.</p><p class="widthNote">한쪽을 접는 경로를 항상 보이게 합니다.<br>새 주제는 공간·기간 계약을 확인한 뒤 연결합니다.</p></div>`}
function render(){let homePage=state.page==='home',s=homePage?null:current();$('#app').className='app'+(isPresentation()?' presentation':'');$('#app').innerHTML=topbar()+(homePage?home():`<div class="workspace" style="--left:${s.left?200:64}px;--right:${s.right?300:0}px">${leftMenu()}${center()}${rightInfo()}</div>`);$('#description').innerHTML=explanation();document.title=homePage?'광고 입지 분석 · 시작 목업':`${dataset().label} · ${viewLabel()} · 배치 목업`}
function notify(message){$('.toast')?.remove();let node=document.createElement('div');node.className='toast';node.setAttribute('role','status');node.textContent=message;$('#app').append(node);setTimeout(()=>node.remove(),3500)}
document.addEventListener('click',event=>{let b=event.target.closest('button');if(!b||b.disabled)return;if(b.hasAttribute('data-home')){state.page='home';state.popover='';render();return}if(b.dataset.topic){enter(b.dataset.topic);return}if(b.hasAttribute('data-resume')){if(state.last)enter(state.last);return}if(b.dataset.mode){let s=current();s.mode=b.dataset.mode;s.left=b.dataset.mode!=='presentation';state.popover='';render();return}if(b.dataset.toggle){let key=b.dataset.toggle;current()[key]=!current()[key];state.popover='';render();let selector=key==='left'?'[data-toggle="left"]':'[data-toggle="right"]';$(selector)?.focus({preventScroll:true});return}if(b.dataset.data){current().data=b.dataset.data;current().view='map';state.popover='';render();return}if(b.dataset.view){current().view=b.dataset.view;state.popover='';render();return}if(b.dataset.popover){let name=b.dataset.popover;state.popover=state.popover===name?'':name;render();$('.popover [data-close-popover]')?.focus({preventScroll:true});return}if(b.hasAttribute('data-close-popover')){closePopover();return}if(b.hasAttribute('data-print')){state.popover='';render();notify('브리핑 인쇄의 메뉴 위치를 확인했습니다. 이 목업에서는 실제 인쇄를 실행하지 않습니다.');return}if(b.hasAttribute('data-add-candidate')){let s=current(),name=selectedName();if(s.candidates.length<3&&!s.candidates.includes(name))s.candidates.push(name);render();return}if(b.hasAttribute('data-remove')){current().candidates.splice(Number(b.dataset.remove),1);render()}});
function closePopover(){let previous=state.popover;state.popover='';render();let trigger=document.querySelector(`[data-popover="${previous}"]`)||document.querySelector('[data-popover="more"]');trigger?.focus({preventScroll:true})}
document.addEventListener('change',event=>{let key=event.target.dataset.query;if(!key)return;query()[key]=event.target.value;let focusId=event.target.id;render();document.getElementById(focusId)?.focus({preventScroll:true})});
document.addEventListener('keydown',event=>{if(event.key==='Escape'&&state.popover){event.preventDefault();closePopover()}});
document.addEventListener('click',event=>{if(state.popover&&!event.target.closest('.popover,[data-popover]')){state.popover='';render()}});
window.addEventListener('resize',()=>{$('#description').innerHTML=explanation()});
render();
</script>
</body></html>
