<script>
(()=>{
const root=document.getElementById('__ROOT__'),body=root.querySelector('.pd-body'),domain='__DOMAIN__',D=__DATA__,before=__BEFORE__;
const pop=domain==='population',pops=['all-all','male-all','female-all','all-young','male-young','female-young'];
const initial={version:4,consultStarted:false,role:'analysis',stage:'after',date:'20261031',hour:18,sex:'all',age:'all',district:'11680',dong:'',market:'3120009',metric:'population',period:5,salesPeriod:3,type:'all',query:'',industry:'all',band:'all',zoom:1,palette:'blue',scale:'zero',focus:!pop,view:'map',queryOpen:true,extra:'',detail:false,candidates:[],compareHour:12,baseline:null};
let s={...initial,...(window.openai?.widgetState?.modelContent?.domain===domain&&window.openai.widgetState.modelContent.state?.version===4?window.openai.widgetState.modelContent.state:{})};
let legend=false,notice='',lastInvoker=null;const E=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=(v,prec=0)=>v==null?'자료 없음':Number(v).toLocaleString('ko-KR',{maximumFractionDigits:prec});
const short=v=>v==null?'자료 없음':!pop&&s.metric==='sales'?(v>=1e12?(v/1e12).toFixed(2)+'조':v>=1e8?(v/1e8).toFixed(1)+'억':fmt(v)):fmt(v);
const unit=()=>!pop&&s.metric==='sales'?'원':'명';
const cohort=(st=s)=>st.sex+'-'+st.age;
const district=()=>D.districts.find(x=>x.code===s.district)||D.districts[0];
const market=(st=s)=>D.markets.find(x=>x.code===st.market)||D.markets[0];
const entity=(st=s)=>pop?(st.dong?D.dongs.find(x=>x.code===st.dong):D.districts.find(x=>x.code===st.district)):market(st);
const series=(st=s)=>{if(pop){if(st.dong)return D.dongs.find(x=>x.code===st.dong)?.population?.[st.date]?.[cohort(st)]||Array(24).fill(null);return D.population[st.date]?.[st.district]?.[cohort(st)]||Array(24).fill(null);}const m=market(st);if(st.metric==='sales')return st.industry==='all'?m.salesTotal:(m.salesByIndustry[st.industry]?.total||Array(4).fill(null));if(st.band!=='all')return m.timePopulation.map(a=>a?.[+st.band]??null);return m[st.sex==='all'?'total':st.sex];};
const index=(st=s)=>pop?st.hour:st.metric==='sales'?st.salesPeriod:st.period;
const value=(st=s)=>series(st)[index(st)]??null;
const period=p=>p.slice(0,4)+'.'+p.slice(4)+'분기';
const labels=(st=s)=>pop?Array.from({length:24},(_,i)=>i+'시'):(st.metric==='sales'?market(st).salesPeriods:market(st).periods).map(period);
const sex=st=>({all:'전체 성별',male:'남성',female:'여성'}[st.sex]);
const target=(st=s)=>pop?(st.age==='young'?'20–39세 · ':'전체 연령 · ')+sex(st):st.metric==='sales'?(st.industry==='all'?'전체 제공 업종':D.meta.industries.find(x=>x.code===st.industry)?.name||'업종'):st.band!=='all'?D.meta.timeBands[+st.band]:sex(st);
const timing=(st=s)=>pop?st.date.slice(0,4)+'.'+st.date.slice(4,6)+'.'+st.date.slice(6)+' · '+st.hour+'시':labels(st)[index(st)];
const opt=(id,label,items,v)=>`<label>${label}<select data-key="${id}" aria-label="${label}">${items.map(([k,l])=>`<option value="${k}"${String(k)===String(v)?' selected':''}>${E(l)}</option>`).join('')}</select></label>`;
function snapshot(){const {role,stage,queryOpen,extra,detail,candidates,baseline,consultStarted,...ctx}=s;return {...ctx};}
if(!s.baseline)s.baseline=snapshot();
function persist(){window.openai?.setWidgetState?.({modelContent:{domain,state:s},privateContent:null})?.catch(()=>{});}
function update(p){Object.assign(s,p);legend=false;render();if(lastInvoker){const button=root.querySelector('[data-action="'+lastInvoker+'"]')||root.querySelector('[data-view="'+lastInvoker+'"]');button?.focus();}persist();}
const dongMap=()=>pop&&s.date==='20261031'&&s.district==='11680'&&(s.focus||!!s.dong);
function list(){if(pop){const objects=dongMap()?D.dongs:D.districts;return objects.map(x=>({code:x.code,name:x.name,value:dongMap()?(x.population[s.date]?.[cohort()]?.[s.hour]??null):D.population[s.date][x.code][cohort()][s.hour]}));}const q=s.query.normalize('NFKC').replace(/\s/g,'').toLowerCase();return D.markets.filter(m=>(s.type==='all'||s.type===m.typeCode)&&(!q||m.name.normalize('NFKC').replace(/\s/g,'').toLowerCase().includes(q))).map(m=>({code:m.code,name:m.name,value:value({...s,market:m.code})}));}
function ensureSelection(){if(!pop){const rows=list();if(rows.length&&!rows.some(x=>x.code===s.market)){s.market=rows[0].code;s.focus=false;notice='현재 검색 조건의 '+rows[0].name+'을 선택했습니다. 후보는 유지됩니다.';}}}
function queryFields(){return pop?`<div class="pd-fields"><fieldset><legend>기간</legend>${opt('date','기준일',[['20261030','2026.10.30'],['20261031','2026.10.31']],s.date)}${opt('hour','조회 시각',Array.from({length:24},(_,i)=>[i,i+'시']),s.hour)}</fieldset><fieldset><legend>지역</legend>${opt('district','자치구',D.districts.map(x=>[x.code,x.name]),s.district)}${s.district==='11680'&&s.date==='20261031'?opt('dong','행정동',[['','강남구 전체'],...D.dongs.map(x=>[x.code,x.name])],s.dong):'<span class="pd-meta">시안의 동별 상세는10/31 강남구22동 지원</span>'}</fieldset><fieldset><legend>분석 대상</legend>${opt('age','연령',[['all','전체 연령'],['young','20–39세']],s.age)}${opt('sex','성별',[['all','전체 성별'],['male','남성'],['female','여성']],s.sex)}</fieldset></div>`:`<div class="pd-fields"><fieldset><legend>자료·기간</legend>${opt('metric','자료',[['population','상권 유동인구'],['sales','상권 추정매출']],s.metric)}${opt(s.metric==='sales'?'salesPeriod':'period','기준 분기',(s.metric==='sales'?market().salesPeriods:market().periods).map((x,i)=>[i,period(x)]),index())}</fieldset><fieldset><legend>종로구74상권</legend><label>상권 이름 검색<input data-key="query" aria-label="상권 이름 검색" placeholder="예: 종로, 혜화" value="${E(s.query)}"></label>${opt('type','상권 유형',[['all','전체 유형'],...Object.entries(Object.fromEntries(D.markets.map(m=>[m.typeCode,m.type])))],s.type)}${opt('market','선택 상권',list().map(m=>[m.code,m.name]),s.market)}</fieldset><fieldset><legend>분석 대상 · 한 기준</legend>${s.metric==='sales'?opt('industry','업종',[['all','전체 제공 업종'],...D.meta.industries.map(x=>[x.code,x.name])],s.industry):opt('band','시간 구성',[['all','전체 시간'],...D.meta.timeBands.map((x,i)=>[i,x])],s.band)+(s.band==='all'?opt('sex','성별',[['all','전체 성별'],['male','남성'],['female','여성']],s.sex):'<span class="pd-meta">시간대 주변분포 · 성별과 교차하지 않음</span>')}</fieldset></div>`;}
function quick(){return `<div class="pd-quick">${pop?opt('district','검토 지역',D.districts.map(d=>[d.code,d.name]),s.district)+opt('hour','검토 시각',Array.from({length:24},(_,i)=>[i,i+'시']),s.hour)+opt('quickTarget','검토 대상',pops.map(x=>[x,target({...s,sex:x.split('-')[0],age:x.split('-')[1]})]),cohort()):opt('market','검토 후보',list().map(m=>[m.code,m.name]),s.market)+opt(s.metric==='sales'?'salesPeriod':'period','검토 분기',(s.metric==='sales'?market().salesPeriods:market().periods).map((x,i)=>[i,period(x)]),index())+(s.metric==='sales'?opt('industry','검토 업종',[['all','전체 제공 업종'],...D.meta.industries.map(x=>[x.code,x.name])],s.industry):opt('marketTarget','검토 대상',[['all','전체 성별'],['male','남성'],['female','여성'],...D.meta.timeBands.map((x,i)=>['t'+i,x])],s.band==='all'?s.sex:'t'+s.band))}</div>`;}

const rows=list(),visible=rows.length>0;const focusBack=s.focus?`<button data-action="parent">← ${pop?(s.dong?'강남구 동 지도':'서울 구 지도'):'종로구 지도'}</button>`:'';const question=s.role==='consult'?(pop?`${entity()?.name}, 어느 시간·대상을 검토할까요?`:`${entity()?.name}, 어떤 후보와 비교할까요?`):pop?'생활인구 · 지역과 시간 비교':'상권 · 규모와 변화 비교';
body.innerHTML=`<div class="pd-product ${s.role==='consult'?'pd-consult':''}"><header class="pd-head"><strong>상권·인구 분석</strong><span class="pd-note">${s.role==='analysis'?'실무 분석':'광고주 현장 협의'} · 개선 시안</span><button data-action="query">${s.role==='analysis'&&!s.detail?(s.queryOpen?'조회 접기':'조회 옵션'):'조건 더 보기'}</button></header><div class="pd-tools"><h2>${E(question)}</h2><div class="pd-tabs">${['map','trend','compare'].map(v=>`<button data-view="${v}" aria-pressed="${s.view===v}">${{map:'지도',trend:'추이',compare:'비교'}[v]}</button>`).join('')}<button data-action="display">표시 설정</button></div></div><div class="pd-context"><strong>${E(entity()?.name)}</strong><span>${timing()}</span><span>${target()}</span><span>${pop?'시점별 내국인 추계 · 고유 방문객 아님':s.metric==='sales'?'분기 추정매출 · 제공 업종':'분기 원본 지표 · 일 고유 방문객 아님'}</span></div>${s.role==='consult'&&!s.detail&&s.extra!=='query'?quick():''}${notice?`<div class="pd-alert" role="status">${E(notice)}</div>`:''}${value()==null?'<div class="pd-alert" role="status">선택 집단 원자료에 비공개·결측이 있어 전체 값을 계산하지 않았습니다. 0이 아닙니다.</div>':''}${s.extra==='display'?`<div class="pd-extra"><div class="pd-fields">${opt('palette','색상',[['blue','기본 파랑'],['teal','청록']],s.palette)}${opt('scale','지도 색상 시작',[['zero','0 포함 · 규모 비교'],['local','관측 최솟값 아래10%']],s.scale)}<button data-action="display">표시 설정 닫기</button></div>${legend?'<p class="pd-meta">현재 규모 지도는0 포함 순차 파랑. 상세 팔레트·직접 min/max는 운영의 기존 도구를 유지하는 후속 연결 항목입니다.</p>':''}</div>`:''}${(s.role==='consult'||s.detail)&&s.extra==='query'?`<div class="pd-extra">${queryFields()}</div>`:''}${s.detail?detail():`<div class="pd-layout ${s.role==='consult'||!s.queryOpen?'pd-closed':''}">${s.role==='analysis'&&s.queryOpen?`<aside class="pd-query" aria-label="조회 조건">${queryFields()}<p>${pop?'시안 지원:2일·25구·강남22동. 다른 월/동은 운영 범위와 별도.':'시안 지원:종로구74곳. 검색·유형은 교집합, 업종은 매출에만 적용.'}</p></aside>`:''}<section class="pd-result" aria-label="주 분석 결과"><div class="pd-result-head"><span class="pd-meta">${s.view==='map'?(pop?'서울25구 / 선택 구·동':'종로구 실제 상권 경계'):s.view==='trend'?`${E(entity()?.name)}의 변화`:'공통 단위·같은 눈금으로 비교'}</span>${focusBack}</div>${!visible?`<div class="pd-empty"><h3>조건에 맞는 상권이 없습니다</h3><p>상권 이름과 유형을 함께 적용했습니다.</p><button data-action="clear">검색·유형 해제</button></div>`:s.view==='map'?map()+(s.role==='analysis'?`<div class="pd-minihead"><span class="pd-meta">${E(entity()?.name)} · ${timing()} · ${short(value())}${value()==null?'':unit()}</span><button data-view="trend">선택 지역 추이 보기 →</button></div>`:''):s.view==='trend'?chart(true):comparison()}</section>${visible?inspector():'<aside class="pd-inspector"><h3>조회 결과0개</h3><p>검색어·유형을 해제하면 다시 조회할 수 있습니다. 기존 후보·협의 기준안은 유지됩니다.</p></aside>'}</div>`}<footer class="pd-footer"><span>${pop?'자료:서울시 생활인구 · 경계2025.06.30':'자료:서울시 상권 유동·추정매출 · 주변분포 교차 불가'}</span><span>설계 표본 · 운영 미적용</span></footer></div>`;
}
function choose(code){s.zoom=1;if(pop){if(D.dongs.some(d=>d.code===code))update({dong:code,focus:true});else update({district:code,dong:'',focus:true});}else update({market:code,focus:true});}
root.addEventListener('click',e=>{const b=e.target.closest('button,[data-entity],[data-point]');if(!b)return;notice='';lastInvoker=b.dataset.action||b.dataset.view||null;if(b.dataset.role){if(b.dataset.role==='consult'&&!s.consultStarted){s.baseline=snapshot();s.consultStarted=true;}update({role:b.dataset.role,extra:'',detail:false});return;}if(b.dataset.stage){update({stage:b.dataset.stage});return;}if(b.dataset.view){update({view:b.dataset.view,detail:false,extra:''});return;}if(b.dataset.entity){choose(b.dataset.entity);return;}if(b.dataset.point!==undefined){update({[pop?'hour':s.metric==='sales'?'salesPeriod':'period']:+b.dataset.point});return;}const a=b.dataset.action;if(a==='query')update(s.role==='analysis'&&!s.detail?{queryOpen:!s.queryOpen}:{extra:s.extra==='query'?'':'query'});if(a==='display')update({extra:s.extra==='display'?'':'display'});if(a==='zoom-out')update({zoom:Math.max(1,s.zoom/1.2)});if(a==='zoom-in')update({zoom:Math.min(3,s.zoom*1.2)});if(a==='parent')update(pop&&s.dong?{focus:true,dong:'',zoom:1}:{focus:false,dong:'',zoom:1});if(a==='legend'){legend=!legend;render();}if(a==='detail')update({detail:true,extra:''});if(a==='back'){update({detail:false});root.querySelector('[data-action=detail]')?.focus();}if(a==='compare')update({view:'compare'});if(a==='restore'){const keep={role:s.role,stage:s.stage,candidates:[...s.candidates],baseline:s.baseline,queryOpen:s.queryOpen};update({...s.baseline,...keep,detail:false});}if(a==='replace'){s.baseline=snapshot();notice='현재 조건을 협의 기준안으로 정했습니다.';update({});}if(a==='candidate'){const id=pop?s.dong||s.district:s.market;if(s.candidates.includes(id))update({candidates:s.candidates.filter(c=>c!==id)});else if(s.candidates.length<3)update({candidates:[...s.candidates,id]});else{notice='후보는3곳까지입니다. 기존 후보를 해제하거나 비교해 주세요.';render();}}if(a==='clear')update({query:'',type:'all'});});
root.addEventListener('change',e=>{const k=e.target.dataset.key;if(!k)return;notice='';let v=['hour','period','salesPeriod','compareHour'].includes(k)?+e.target.value:e.target.value;let patch={[k]:v};if(k==='district')Object.assign(patch,{dong:'',focus:true});if(k==='date'&&s.dong){patch.dong='';notice='동별 시안은10/31만 지원하여 구 전체로 돌아갑니다.';}if(k==='marketTarget'){patch=v.startsWith('t')?{band:v.slice(1),sex:'all'}:{band:'all',sex:v};}if(k==='quickTarget'){const [sex,age]=v.split('-');patch={sex,age};}if(k==='market')patch.focus=true;if(k==='metric'){patch.band='all';patch.sex='all';notice='자료 전환으로 성별·시간 구성 조건을 전체로 바꿨습니다. 각 자료의 분기는 유지됩니다.';}if(k==='band'&&v!=='all')patch.sex='all';Object.assign(s,patch);if(k==='type')ensureSelection();update({});root.querySelector(`[data-key="${k}"]`)?.focus();});
root.addEventListener('input',e=>{if(e.target.dataset.key==='query'){const start=e.target.selectionStart;s.query=e.target.value;notice='';ensureSelection();render();const n=root.querySelector('[data-key=query]');n?.focus();n?.setSelectionRange(start,start);persist();}});
root.addEventListener('keydown',e=>{if(e.key==='Escape'){legend=false;update({extra:''});root.querySelector('[data-action=query]')?.focus();}});
window.addEventListener('openai:set_globals',e=>{const saved=e.detail?.globals?.widgetState?.modelContent;if(saved?.domain===domain&&saved.state?.version===4){s={...initial,...saved.state};if(!s.baseline)s.baseline=snapshot();render();}});
render();
let rw=root.clientWidth;new ResizeObserver(()=>{if(Math.abs(root.clientWidth-rw)>1){rw=root.clientWidth;render();}}).observe(root);
if(globalThis.Tweak){const design={side:280};const t=new Tweak({container:root,onChange:()=>{root.style.setProperty('--pd-side',design.side+'px');}});t.addSlider(design,'side',{label:'실무 정보창 폭',min:260,max:360,step:10,unit:'px'});}
})();
</script>
