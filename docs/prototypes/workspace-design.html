else{let f='';if(state.editor==='period')f=isPop()?select('ad-date','기준일',[['20261030','2026.10.30'],['20261031','2026.10.31']],state.date)+select('ad-hour','조회 시각',Array.from({length:24},(_,i)=>[i,i+'시']),state.hour):select('ad-period','기준 분기',market().periods.map((p,i)=>[i,periodLabel(p)]),state.period);
if(state.editor==='region')f=isPop()?select('ad-region','자치구',D.districts.map(x=>[x.code,x.name]),state.selected):select('ad-market','대표 상권',D.markets.map(x=>[x.code,x.name]),state.market)+`<p>종로구 대표 3곳을 넣은 시안입니다. 전체 상권 검색은 운영 구현 단계에서 연결합니다.</p>`;
if(state.editor==='target')f=select('ad-sex','성별',[['all','전체 성별'],['male','남성'],['female','여성']],state.sex)+(isPop()?select('ad-age','연령',[['all','전체 연령'],['young','20–39세']],state.age):`<p>이 시안은 성별 한 가지 분포를 비교합니다. 원자료의 성별·연령·시간 개별 분포를 임의로 교차하지 않습니다.</p>`);
body=`<button class="ad-back" data-action="query-root">‹ 조회 항목</button><h3>${{period:'자료·기간',region:'공간·대상 지역',target:'인구 집단'}[state.editor]}</h3><div class="ad-fields">${f}</div>`;}
return `<aside class="ad-query" aria-label="조회 조건">${body}</aside>`;}
function map(){if(!isPop())return `<svg class="ad-map" viewBox="${state.marketFocus?(()=>{const b=market().bounds;return [b[0][0]-8,b[0][1]-8,b[1][0]-b[0][0]+16,b[1][1]-b[0][1]+16].join(' ')})():'0 0 700 460'}" role="img" aria-label="종로구 경계와 대표 세 상권의 실제 경계"><path d="${D.marketOutline}" fill="var(--ad-soft)" style="cursor:default"/>${D.markets.filter(m=>!state.marketFocus||m.code===state.market).map(m=>`<path data-market="${m.code}" class="${m.code===state.market?'ad-picked':''}" d="${m.path}" fill="var(--ad-blue)" data-tooltip="${esc(m.name)} · ${fmt(m[state.sex==='all'?'total':state.sex][state.period])}명"/>`).join('')}</svg><div class="ad-map-readout">${esc(region())} · ${fmt(value())}명</div><div class="ad-sub">종로구 대표 3곳의 경계 · 색은 위치 표시이며 규모는 우측 수치로 비교</div>`;
const values=D.districts.map(d=>D.population[state.date][d.code][state.sex+'-'+state.age][state.hour]);const max=Math.max(...values),min=Math.min(...values);let vb='0 0 700 460';if(state.scope){const b=D.districts.find(d=>d.code===state.scope).bounds;vb=`${b[0][0]-15} ${b[0][1]-15} ${b[1][0]-b[0][0]+30} ${b[1][1]-b[0][1]+30}`;}
return `<svg class="ad-map" viewBox="${vb}" role="img" aria-label="${state.scope?district().name:'서울 25구'} 생활인구 지도. 조회 옵션의 자치구 선택으로 같은 결과를 볼 수 있습니다.">${D.districts.filter(d=>!state.scope||d.code===state.scope).map((d)=>{const v=D.population[state.date][d.code][state.sex+'-'+state.age][state.hour];return `<path d="${d.path}" data-district="${d.code}" class="${d.code===state.selected?'ad-picked':''}" fill="color-mix(in srgb,var(--ad-blue) ${Math.round(20+80*(v-min)/(max-min||1))}%,var(--ad-panel))" data-tooltip="${d.name} · ${fmt(v)}명 · 선택하면 구 확대"/>`;}).join('')}</svg><div class="ad-map-readout" aria-live="polite">${district().name} · ${state.hour}시 ${fmt(value())}명</div><div class="ad-map-caption"><span>${state.scope?'선택 구 확대 · 동별 조회는 후속 구현':'색상은 같은 시각의 구별 규모 비교'}</span><span class="ad-legend"><span class="ad-gradient"></span><button data-action="legend" aria-expanded="${ui.legend}">범례</button></span></div>${ui.legend?`<div class="ad-floatbox">${fmt(min)}–${fmt(max)}명 · 현재 서울 25구 공통 범위. 주황 테두리는 선택 지역입니다. 색상 조정은 표시 설정으로 분리합니다.</div>`:''}`;}
function chart(){
const s=series(),ls=labels(),cw=content.getBoundingClientRect().width,w=Math.max(280,state.screen==='brief'?cw-44:state.screen==='detail'?Math.min(state.enlarged?cw-72:780,cw-72):cw-(state.query?200:0)-(state.info&&cw>850?205:0)-28),h=state.screen==='brief'?340:state.enlarged&&state.screen==='detail'?350:280,left=66,right=22,top=24,bottom=42,max=Math.max(...s)*1.08;
const xx=i=>left+i*(w-left-right)/(s.length-1), yy=v=>h-bottom-v/max*(h-top-bottom);
const ticks=isPop()?[0,6,12,18,23]:[0,2,5];
return `<div class="ad-plot"><svg class="ad-chart" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" role="img" aria-label="${esc(region())} ${metric()} 추이, ${dateLabel()} ${fmt(value())}명">${[0,.5,1].map(k=>`<line x1="${left}" y1="${yy(max*k)}" x2="${w-right}" y2="${yy(max*k)}" stroke="var(--ad-line)"/>`).join('')}<path d="${s.map((v,i)=>(i?'L':'M')+xx(i).toFixed(1)+','+yy(v).toFixed(1)).join(' ')}" fill="none" stroke="var(--ad-blue)" stroke-width="3" vector-effect="non-scaling-stroke"/>${s.map((v,i)=>`<circle data-point="${i}" cx="${xx(i)}" cy="${yy(v)}" r="${i===idx()?6:4}" fill="${i===idx()?'var(--ad-warm)':'var(--ad-panel)'}" stroke="var(--ad-blue)" stroke-width="2" data-tooltip="${esc(ls[i])} · ${fmt(v)}명"/>`).join('')}</svg><span class="ad-unit">만 명 · 0 포함</span>${[0,.5,1].map(k=>`<span class="ad-ytick" style="top:${yy(max*k)/h*100}%;left:${(left-8)/w*100}%">${(max*k/10000).toFixed(1)}</span>`).join('')}${ticks.map((i,n)=>`<span class="ad-xtick ${n===0?'ad-first':n===ticks.length-1?'ad-last':''}" style="left:${xx(i)/w*100}%">${isPop()?ls[i]:market().periods[i].slice(0,4)+'.'+market().periods[i].slice(4)+'분기'}</span>`).join('')}</div>`;
}
function compare(){const s=series(),a=isPop()?state.compare:Math.max(0,state.period-1),b=idx(),max=Math.max(s[a],s[b]),delta=s[b]-s[a];return `<div class="ad-compare">${[a,b].map((i,j)=>`<section><h3>${j?'선택':'기준'}</h3><div class="ad-sub">${esc(labels()[i])}</div><div class="ad-num">${fmt(s[i])}<small> 명</small></div><div class="ad-compare-bar"><span style="width:${s[i]/max*100}%"></span></div></section>`).join('')}</div><p class="ad-result">선택 − 기준 <strong>${delta>=0?'+':''}${fmt(delta)}명</strong> · ${s[a]?(delta/s[a]*100).toFixed(1)+'%':'기준값 0으로 증감률 미계산'} · 동일 지역·집단</p>${isPop()?`<div class="ad-fields">${select('ad-compare','비교 기준 시각',Array.from({length:24},(_,i)=>[i,i+'시']),state.compare)}</div>`:''}`;}
function ranks(){const rows=isPop()?D.districts.map(d=>({code:d.code,name:d.name,value:D.population[state.date][d.code][state.sex+'-'+state.age][state.hour]})).sort((a,b)=>b.value-a.value).slice(0,3):D.markets.map(m=>({code:m.code,name:m.name,value:m[state.sex==='all'?'total':state.sex][state.period]})).sort((a,b)=>b.value-a.value);return `<div class="ad-ranks">${rows.map((r,i)=>`<div class="ad-rank"><button ${isPop()?'data-district':'data-market'}="${r.code}">${i+1}. ${esc(r.name)}<br><strong>${fmt(r.value)}명</strong></button><div class="ad-track"><span style="width:${r.value/rows[0].value*100}%"></span></div></div>`).join('')}</div>`;}
function inspector(){return state.info?`<aside class="ad-inspector" aria-label="선택 지역 정보"><h3>${esc(region())}</h3><div class="ad-value">${fmt(value())}<small> 명</small></div><p>${esc(dateLabel())}${isPop()?' · '+state.hour+'시':''} · ${sexLabel()}${isPop()?' · '+ageLabel():''}</p><div class="ad-actions"><button class="ad-primary" data-go="detail">이 지역 상세 분석 →</button><button data-action="compare-view">${isPop()?'두 시각':'두 분기'} 비교</button></div><p>현재 조건 ${isPop()?'25구 상위 3곳':'대표 3곳 비교'}</p>${ranks()}</aside>`:'';}
function work(){return `<div class="ad-toolbar"><h2>${isPop()?'구·동 인구 검토':'상권 입지 검토'}</h2><div class="ad-actions"><button data-action="query" aria-pressed="${state.query}">조회 옵션</button><button data-action="info" aria-pressed="${state.info}">선택 정보</button><button data-go="brief">브리핑으로</button></div></div>${context()}<div class="ad-grid ${state.query?'':'ad-noquery'} ${state.info?'':'ad-noinfo'}">${query()}<section class="ad-main" aria-label="주 분석 결과"><div class="ad-main-head"><div class="ad-actions">${['map','trend','compare'].map(v=>`<button data-view="${v}" aria-pressed="${state.view===v}">${{map:'지도',trend:'추이',compare:'비교'}[v]}</button>`).join('')}</div>${state.scope&&isPop()?'<button data-action="parent">‹ 서울 전체</button>':!isPop()&&state.marketFocus?'<button data-action="parent">‹ 종로구 전체</button>':''}</div>${state.view==='map'?map():state.view==='trend'?`<h3>${esc(region())} ${isPop()?'하루의 변화':'분기별 변화'}</h3>${chart()}<div class="ad-map-readout">선택 ${labels()[idx()]} · ${fmt(value())}명</div>`:compare()}</section>${inspector()}</div>`;}
function detail(){return `<div class="ad-toolbar"><h2>${esc(region())} 상세 분석</h2><div class="ad-actions"><button data-go="work">‹ 분석으로 복귀</button><button data-go="brief">브리핑으로</button></div></div>${context()}${state.query?`<div class="ad-query">${query().replace(/<\/?aside[^>]*>/g,'')}</div>`:''}<div class="ad-detail"><div class="ad-modules"><section class="ad-module"><div class="ad-modulehead"><div><h3>${isPop()?'언제 생활인구가 달라지는가':'분기별 유동 규모가 어떻게 달라지는가'}</h3><div class="ad-sub">${esc(region())} · ${sexLabel()}${isPop()?' · '+ageLabel():''}</div></div><button data-action="enlarge">${state.enlarged?'기본 크기':'그래프 확대'}</button></div><div class="ad-reading ${state.enlarged?'ad-enlarged':''}">${chart()}<p class="ad-result">선택 ${labels()[idx()]} · ${fmt(value())}명. ${isPop()?'시각별 값을 더해 하루 방문객으로 해석하지 않습니다.':'서로 다른 분기의 원본 지표 변화입니다.'}</p></div></section><section class="ad-module"><div class="ad-modulehead"><h3>같은 지역, 두 시점 비교</h3><button data-action="module" aria-expanded="${state.module==='compare'}">${state.module==='compare'?'접기':'펼치기'}</button></div>${state.module==='compare'?compare():''}</section><section class="ad-module"><div class="ad-modulehead"><h3>정확한 수치와 자료 정의</h3><button data-action="table" aria-expanded="${ui.table}">${ui.table?'접기':'표 보기'}</button></div>${ui.table?`<table class="ad-table"><thead><tr><th>시점</th><th>${metric()} · 명</th></tr></thead><tbody>${series().map((v,i)=>`<tr><td>${esc(labels()[i])}</td><td>${Number(v).toLocaleString('ko-KR',{maximumFractionDigits:2})}</td></tr>`).join('')}</tbody></table>`:''}</section></div></div>`;}
function brief(){const comparison=state.briefScene===1;return `<div class="ad-brief"><div class="ad-brief-top"><div><div class="ad-kicker">광고 입지 검토 · ${esc(region())}</div><h1>${comparison?'같은 조건에서 두 시점을 비교합니다':isPop()?'시간에 따른 체류 규모를 확인합니다':'상권 유동 규모의 변화를 확인합니다'}</h1></div><button data-go="work">분석으로 복귀</button></div><div class="ad-context">${esc(dateLabel())} · ${sexLabel()}${isPop()?' · '+ageLabel():''} · ${isPop()?'시점별 체류 추계':'분기 원본 추정 지표'}</div>${comparison?compare():chart()}<div class="ad-brief-bottom"><div class="ad-value">${fmt(value())}<small> 명 · ${esc(labels()[idx()])}</small></div><div class="ad-actions"><button data-action="brief-trend" aria-pressed="${!comparison}">변화 추이</button><button data-action="brief-compare" aria-pressed="${comparison}">두 시점 비교</button></div></div><p class="ad-sub">${isPop()?'같은 시각의 체류 추정 인원이며 고유 방문객이나 광고 도달 수가 아닙니다.':'원본 유동인구 지표이며 일 고유 방문객이나 광고 도달 수가 아닙니다.'}</p></div>`;}
function home(){return `<div class="ad-home"><div class="ad-kicker">광고주 브리핑을 위한 지역 수요 검토</div><h1>어떤 입지 판단을<br>시작하시겠습니까?</h1><p>지역을 찾고, 시간과 대상을 비교한 뒤 브리핑으로 연결합니다.</p><div class="ad-choices"><button class="ad-choice" data-domain="population"><strong>구·동 인구 검토</strong><span>시간과 대상에 따른 체류 규모 확인</span><em>생활인구 25구 시안 →</em></button><button class="ad-choice" data-domain="market"><strong>상권 입지 검토</strong><span>상권별 규모와 분기 변화 확인</span><em>종로구 대표 3상권 시안 →</em></button></div>${state.hasWork?`<div class="ad-actions"><button data-action="resume">이전 분석 이어보기 · ${esc(region())}</button></div>`:''}<div class="ad-future" style="margin-top:28px"><span>확장 예정 주제</span><span>역·노선 이동 수요</span><span>부동산 입지·가격</span><span class="ad-sub">자료 확보 후 같은 작업공간에 연결</span></div></div>`;}
function render(){root.classList.toggle('ad-isbrief',state.screen==='brief');root.querySelectorAll('[data-go]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.go===state.screen));content.innerHTML=state.screen==='home'?home():state.screen==='work'?work():state.screen==='detail'?detail():brief();}
root.addEventListener('click',e=>{const b=e.target.closest('button,[data-district],[data-market],[data-point]');if(!b)return;lastFocus=b.dataset.go?null:{key:b.dataset.action?'action':b.dataset.edit?'edit':b.dataset.view?'view':null,value:b.dataset.action||b.dataset.edit||b.dataset.view};if(b.dataset.go){const target=b.dataset.go;change({screen:target,query:false,editor:''});const focus=target==='work'?root.querySelector('.ad-inspector [data-go=detail]'):root.querySelector('.ad-global [data-go="'+target+'"]');focus?.focus();return;}if(b.dataset.domain){change({domain:b.dataset.domain,screen:'work',view:'map',query:false,scope:'',age:'all'});return;}if(b.dataset.edit){change({query:true,editor:b.dataset.edit});return;}if(b.dataset.view){change({view:b.dataset.view});return;}if(b.dataset.district){change({selected:b.dataset.district,scope:b.dataset.district});return;}if(b.dataset.market){change({market:b.dataset.market,marketFocus:true});return;}if(b.dataset.point!==undefined){change(isPop()?{hour:+b.dataset.point}:{period:+b.dataset.point});return;}const a=b.dataset.action;if(a==='query')change({query:!state.query,editor:''});if(a==='query-root')change({editor:''});if(a==='info')change({info:!state.info});if(a==='parent')change({scope:'',marketFocus:false});if(a==='compare-view')change({view:'compare'});if(a==='legend'){ui.legend=!ui.legend;render();}if(a==='module')change({module:state.module==='compare'?'trend':'compare'});if(a==='table'){ui.table=!ui.table;render();}if(a==='enlarge')change({enlarged:!state.enlarged});if(a==='resume')change({screen:'work'});if(a==='brief-trend')change({briefScene:0});if(a==='brief-compare')change({briefScene:1});});
root.addEventListener('change',e=>{const map={'ad-date':'date','ad-hour':'hour','ad-region':'selected','ad-market':'market','ad-period':'period','ad-sex':'sex','ad-age':'age','ad-compare':'compare'};const k=map[e.target.id];if(k){const v=['hour','period','compare'].includes(k)?+e.target.value:e.target.value;change({...{[k]:v},...(k==='selected'?{scope:v}:{}),...(k==='market'?{marketFocus:true}:{})});root.querySelector('#'+e.target.id)?.focus();}});
root.querySelector('#ad-source').addEventListener('click',()=>{const box=root.querySelector('#ad-source-info');box.hidden=!box.hidden;});
root.addEventListener('keydown',e=>{if(e.key==='Escape'&&state.query)change({query:false,editor:''});});
render();
let observedWidth=root.clientWidth;new ResizeObserver(()=>{if(Math.abs(root.clientWidth-observedWidth)>1){observedWidth=root.clientWidth;render();}}).observe(root);
if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:()=>{root.style.setProperty('--ad-blue',design.accent);}});const design={accent:'#285f92'};tweak.addColorPicker(design,'accent',{label:'도표 강조색',reference:'--ad-blue'});}
})();
</script>
